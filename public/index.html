<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم المنصة الذكية</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Tajawal', sans-serif; background: #0b0f19; color: #e2e8f0; }
    .glass-panel { background: rgba(17, 24, 39, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-input { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); color: #f8fafc; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="p-4 pb-32">
  <div class="max-w-7xl mx-auto space-y-6">
    <!-- الرئيسية -->
    <div id="tab-home" class="tab-content active glass-panel rounded-2xl p-6">
      <h1 class="text-2xl font-bold mb-4">لوحة التحكم</h1>
      <button onclick="toggleMaintenance()" class="bg-indigo-600 px-4 py-2 rounded text-white"><span id="maintenanceText">البوت يعمل 🟢</span></button>
      <div class="grid grid-cols-2 gap-4 mt-6">
        <div class="glass-input p-4 rounded-xl text-center">الطلاب<div id="statTotalUsers" class="text-3xl font-bold">0</div></div>
        <div class="glass-input p-4 rounded-xl text-center">المحاضرات<div id="statTotalMaterials" class="text-3xl font-bold">0</div></div>
      </div>
    </div>

    <!-- الجدول -->
    <div id="tab-schedule" class="tab-content glass-panel rounded-2xl p-6">
      <h2 class="text-xl font-bold mb-4">الجدول الآلي</h2>
      <input type="text" id="schChannel" placeholder="ID القناة (يجب أن يبدأ بـ -100)" class="glass-input w-full p-2 rounded mb-2" dir="ltr">
      <select id="schDaySelect" onchange="changeScheduleDay()" class="glass-input w-full p-2 rounded mb-2">
        <option value="0">الأحد</option><option value="1">الإثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option><option value="5">الجمعة</option><option value="6">السبت</option>
      </select>
      <textarea id="schContent" rows="4" class="glass-input w-full p-2 rounded mb-2"></textarea>
      <button onclick="saveScheduleSettings()" class="bg-purple-600 px-4 py-2 rounded text-white">حفظ</button>
      <button onclick="sendScheduleNow()" class="bg-emerald-600 px-4 py-2 rounded text-white">إرسال الآن للقناة</button>
    </div>

    <!-- التيرمات -->
    <div id="tab-semesters" class="tab-content glass-panel rounded-2xl p-6">
      <h2 class="text-xl font-bold mb-4">التيرمات</h2>
      <form id="addSemesterForm" class="flex gap-2 mb-4">
        <input type="text" id="semIdInput" placeholder="ID (مثال: sem1)" required class="glass-input p-2 rounded w-1/4">
        <input type="text" id="semNameInput" placeholder="اسم التيرم" required class="glass-input p-2 rounded w-1/2">
        <select id="semActiveInput" class="glass-input p-2 rounded w-1/4"><option value="true">مرئي</option><option value="false">مخفي</option></select>
        <button type="submit" class="bg-indigo-600 px-4 py-2 rounded text-white">حفظ</button>
      </form>
      <table class="w-full text-right"><tbody id="semestersTbody"></tbody></table>
    </div>

    <!-- المحاضرات -->
    <div id="tab-materials" class="tab-content glass-panel rounded-2xl p-6">
      <h2 class="text-xl font-bold mb-4" id="formTitle">رفع محتوى جديد</h2>
      <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden text-xs text-rose-400 border border-rose-500/20 px-3 py-1.5 rounded-xl mb-4">إلغاء التعديل</button>
      
      <form id="addMaterialForm" class="space-y-4 mb-6">
        <input type="hidden" id="editDocId">
        <select id="semSelect" onchange="updateSubjectsDropdown()" required class="glass-input w-full p-2 rounded"></select>
        <div class="flex gap-2">
          <select id="existingSubjects" onchange="document.getElementById('subjectName').value = this.value" class="glass-input w-1/3 p-2 rounded"></select>
          <input type="text" id="subjectName" placeholder="اسم المادة" required class="glass-input w-2/3 p-2 rounded">
        </div>
        <input type="text" id="lectureTitle" placeholder="اسم المحاضرة" required class="glass-input w-full p-2 rounded">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 border border-gray-700 p-4 rounded">
          <div>
            <label class="text-[10px] text-slate-400">رقم رسالة الملف الأساسي 📄</label>
            <input type="number" id="fileMessageId" placeholder="مثال: 153" class="glass-input w-full p-2 rounded mt-1">
          </div>
          <div>
            <label class="text-[10px] text-slate-400">رقم رسالة الملف المترجم 🌐</label>
            <input type="number" id="translatedMessageId" placeholder="مثال: 154" class="glass-input w-full p-2 rounded mt-1">
          </div>
          <div class="md:col-span-2">
            <label class="text-[10px] text-slate-400">رابط الأسئلة (فورم/موقع) 📝</label>
            <input type="url" id="questionsLink" placeholder="https://..." class="glass-input w-full p-2 rounded mt-1" dir="ltr">
          </div>
        </div>
        <button type="submit" class="w-full bg-indigo-600 py-3 rounded text-white font-bold">حفظ المحاضرة</button>
      </form>
      
      <input type="text" id="tableSearch" onkeyup="filterTable()" placeholder="بحث سريع عن محاضرة..." class="glass-input w-full rounded p-2 mb-4 text-sm">
      <table class="w-full text-right"><tbody id="materialsTable"></tbody></table>
    </div>

    <!-- الإذاعة -->
    <div id="tab-broadcast" class="tab-content glass-panel rounded-2xl p-6">
      <h2 class="text-xl font-bold mb-4">إذاعة</h2>
      <textarea id="broadcastMsg" rows="5" class="glass-input w-full p-2 rounded mb-4" placeholder="اكتب رسالة لتصل لكل الطلاب..."></textarea>
      <button onclick="sendBroadcast()" class="bg-emerald-600 px-4 py-3 rounded text-white w-full">إرسال للكل</button>
    </div>

    <!-- الطلاب -->
    <div id="tab-users" class="tab-content glass-panel rounded-2xl p-6">
      <h2 class="text-xl font-bold mb-4">الطلاب</h2>
      <input type="text" id="userSearch" onkeyup="filterUsers()" placeholder="بحث بالاسم أو ID..." class="glass-input w-full rounded p-2 mb-4 text-sm">
      <table class="w-full text-right"><tbody id="usersTbody"></tbody></table>
    </div>
  </div>

  <nav class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-slate-900 border border-white/10 rounded-2xl p-2 flex gap-2 z-50">
    <button onclick="switchTab('home')" class="p-2 text-indigo-400">الرئيسية</button>
    <button onclick="switchTab('schedule')" class="p-2 text-white">الجدول</button>
    <button onclick="switchTab('semesters')" class="p-2 text-white">التيرمات</button>
    <button onclick="switchTab('materials')" class="p-2 text-white">المحاضرات</button>
    <button onclick="switchTab('broadcast')" class="p-2 text-white">إذاعة</button>
    <button onclick="switchTab('users')" class="p-2 text-white">الطلاب</button>
  </nav>

  <script>
    function switchTab(id) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + id).classList.add('active');
    }

    // ===================================
    // ضع بيانات Firebase الخاصة بك هنا
    // ===================================
    const firebaseConfig = { 
        apiKey: "YOUR_API_KEY", 
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com", 
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com", 
        projectId: "YOUR_PROJECT_ID", 
        storageBucket: "YOUR_PROJECT_ID.appspot.com", 
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID", 
        appId: "YOUR_APP_ID" 
    };
    firebase.initializeApp(firebaseConfig); const db = firebase.firestore();
    
    let allMaterialsCache = [], allSemestersCache = [], isMaintenance = false;
    const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
    async function promptAdminKey() { const { value: k } = await Swal.fire({ title: 'الرمز السري', input: 'password' }); return k; }

    // الجدول
    let scheduleConfig = { channelId: '', sendTime: '20', days: {} };
    db.collection('settings').doc('scheduleConfig').onSnapshot(doc => { if(doc.exists) { scheduleConfig = doc.data(); if(!scheduleConfig.days) scheduleConfig.days={}; document.getElementById('schChannel').value = scheduleConfig.channelId||''; changeScheduleDay(); } });
    function changeScheduleDay() { document.getElementById('schContent').value = scheduleConfig.days[document.getElementById('schDaySelect').value] || ''; }
    async function saveScheduleSettings() { const k = await promptAdminKey(); if(k){ scheduleConfig.channelId = document.getElementById('schChannel').value; scheduleConfig.days[document.getElementById('schDaySelect').value] = document.getElementById('schContent').value; await db.collection('settings').doc('scheduleConfig').set(scheduleConfig, {merge:true}); Toast.fire({icon:'success',title:'تم'}); } }
    async function sendScheduleNow() { const k = await promptAdminKey(); if(k){ await fetch("/api/schedule", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ secretKey: k, dayIndex: document.getElementById('schDaySelect').value }) }).then(res => res.json()).then(data => { if(data.success) Toast.fire({icon:'success',title:'أرسل'}); else Swal.fire('خطأ', data.error, 'error'); }); } }

    // التيرمات
    db.collection("semesters").orderBy("order").onSnapshot(snap => {
      allSemestersCache = []; document.getElementById("semestersTbody").innerHTML = ""; document.getElementById("semSelect").innerHTML = '<option value="">-- اختر --</option>';
      snap.forEach(doc => { const d = doc.data(); allSemestersCache.push({id: doc.id, ...d}); document.getElementById("semSelect").innerHTML += `<option value="${doc.id}">${d.name}</option>`; document.getElementById("semestersTbody").innerHTML += `<tr><td class="p-2">${d.name}</td><td class="p-2 text-left"><button onclick="db.collection('semesters').doc('${doc.id}').delete()" class="text-red-500">حذف</button></td></tr>`; });
    });
    document.getElementById("addSemesterForm").addEventListener("submit", async e => { e.preventDefault(); const k = await promptAdminKey(); if(k){ await db.collection("semesters").doc(document.getElementById("semIdInput").value).set({ name: document.getElementById("semNameInput").value, isActive: document.getElementById("semActiveInput").value === "true", order: Date.now() }, {merge:true}); Toast.fire({icon:'success',title:'تم'}); e.target.reset(); } });

    // المحاضرات
    db.collection("materials").orderBy("createdAt", "desc").onSnapshot(snap => {
      allMaterialsCache = []; document.getElementById("statTotalMaterials").innerText = snap.size; document.getElementById("materialsTable").innerHTML = "";
      snap.forEach(doc => { const d = doc.data(); allMaterialsCache.push({id: doc.id, ...d}); document.getElementById("materialsTable").innerHTML += `<tr class="border-b border-gray-800"><td class="p-2">${d.subjectName||d.name}</td><td class="p-2">${d.lectureTitle||d.name}</td><td class="p-2 text-left"><button onclick="editMaterial('${doc.id}')" class="text-blue-500 mr-2">تعديل</button><button onclick="db.collection('materials').doc('${doc.id}').delete()" class="text-red-500">حذف</button></td></tr>`; }); updateSubjectsDropdown();
    });
    function updateSubjectsDropdown() { const sem = document.getElementById("semSelect").value; const sel = document.getElementById("existingSubjects"); sel.innerHTML='<option value="">-- مواد مسجلة --</option>'; const s=new Set(); allMaterialsCache.forEach(i=>{if(i.semester===sem) s.add(i.subjectName||i.name);}); s.forEach(n=>sel.innerHTML+=`<option value="${n}">${n}</option>`); }
    
    document.getElementById("addMaterialForm").addEventListener("submit", async e => {
      e.preventDefault(); const k = await promptAdminKey(); if(!k) return;
      const f = document.getElementById("fileMessageId").value;
      const t = document.getElementById("translatedMessageId").value;
      const ql = document.getElementById("questionsLink").value;
      
      if(!f && !t && !ql) return Swal.fire('تنبيه', 'يجب إدخال مرفق واحد على الأقل', 'warning');
      
      const data = { semester: document.getElementById("semSelect").value, subjectName: document.getElementById("subjectName").value, lectureTitle: document.getElementById("lectureTitle").value, updatedAt: new Date().toISOString() };
      
      if(f) data.fileMessageId = parseInt(f); else data.fileMessageId = firebase.firestore.FieldValue.delete();
      if(t) data.translatedMessageId = parseInt(t); else data.translatedMessageId = firebase.firestore.FieldValue.delete();
      if(ql) data.questionsLink = ql; else data.questionsLink = firebase.firestore.FieldValue.delete();
      
      const id = document.getElementById("editDocId").value;
      if(id) { await db.collection("materials").doc(id).update(data); } else { data.createdAt = new Date().toISOString(); await db.collection("materials").add(data); }
      resetForm(); Toast.fire({icon:'success',title:'تم'});
    });
    
    function editMaterial(id) { 
      const i = allMaterialsCache.find(m=>m.id===id); 
      if(i) { 
        document.getElementById("editDocId").value=id; 
        document.getElementById("semSelect").value=i.semester; 
        document.getElementById("subjectName").value=i.subjectName; 
        document.getElementById("lectureTitle").value=i.lectureTitle; 
        document.getElementById("fileMessageId").value=i.fileMessageId||''; 
        document.getElementById("translatedMessageId").value=i.translatedMessageId||''; 
        document.getElementById("questionsLink").value=i.questionsLink||''; 
        document.getElementById("formTitle").innerText = 'تعديل المحاضرة';
        document.getElementById("cancelEditBtn").classList.remove("hidden");
        window.scrollTo(0,0); 
      } 
    }

    function resetForm() { document.getElementById("editDocId").value=""; document.getElementById("addMaterialForm").reset(); document.getElementById("cancelEditBtn").classList.add("hidden"); document.getElementById("formTitle").innerText='رفع محتوى جديد'; }
    function filterTable() { const q = document.getElementById("tableSearch").value.toLowerCase(); document.querySelectorAll("#materialsTable tr").forEach(r => r.style.display = r.innerText.toLowerCase().includes(q)?"":"none"); }

    // الإذاعة والطلاب والصيانة
    async function sendBroadcast() { const k = await promptAdminKey(); if(k){ await fetch("/api/broadcast", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ secretKey: k, message: document.getElementById("broadcastMsg").value }) }).then(res => res.json()).then(data => { if(data.success) { Toast.fire({icon:'success',title:'تم الإرسال'}); document.getElementById("broadcastMsg").value=""; } else { Swal.fire('خطأ', data.error, 'error'); } }); } }
    db.collection("users").orderBy("updatedAt","desc").onSnapshot(snap => { document.getElementById("statTotalUsers").innerText = snap.size; document.getElementById("usersTbody").innerHTML = ""; snap.forEach(doc => { const d = doc.data(); document.getElementById("usersTbody").innerHTML += `<tr class="border-b border-gray-800"><td class="p-2">${d.firstName}</td><td class="p-2 text-left"><button onclick="db.collection('users').doc('${doc.id}').update({isBanned:${!d.isBanned}})" class="${d.isBanned?'text-green-500':'text-red-500'}">${d.isBanned?'فك حظر':'حظر'}</button></td></tr>`; }); });
    function filterUsers() { const q = document.getElementById("userSearch").value.toLowerCase(); document.querySelectorAll("#usersTbody tr").forEach(r => r.style.display = r.innerText.toLowerCase().includes(q)?"":"none"); }
    db.collection("settings").doc("system").onSnapshot(doc => { const maint = doc.exists && doc.data().maintenance; document.getElementById("maintenanceText").innerText = maint ? "البوت متوقف 🔴" : "البوت يعمل 🟢"; isMaintenance = maint; });
    async function toggleMaintenance() { const k = await promptAdminKey(); if(k){ await db.collection("settings").doc("system").set({maintenance:!isMaintenance},{merge:true}); } }
  </script>
</body>
</html>
